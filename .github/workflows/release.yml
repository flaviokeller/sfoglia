# Netlify deploys production from the `release` branch, not `main`.
# Run this workflow to ship: it fast-forwards `release` to the selected branch.
name: Release

on: workflow_dispatch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git push origin HEAD:release
